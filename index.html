<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مسلم - صلاتي وأذكاري</title>
  
  <!-- إعدادات الـ PWA للآيفون -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مسلم - صلاتي وأذكاري">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* اللون الأخضر الملكي لقبة المسجد النبوي */
      --madinah-green: #0a3a2a;
      --madinah-dark: #05261b;
      --gold-accent: #d4af37;
      --card-bg: #ffffff;
      --text-dark: #112211;
      --text-muted: #556655;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background: linear-gradient(180deg, var(--madinah-green) 0%, var(--madinah-dark) 100%);
      color: var(--text-dark); 
      padding-bottom: 40px; 
      min-height: 100vh; 
    }

    /* الهيدر مع مسافة علوية مريحة */
    header {
      background: rgba(255, 255, 255, 0.08);
      color: white;
      text-align: center;
      padding: 24px 15px 16px 15px;
    }
    header h1 { font-size: 21px; font-weight: 800; color: #ffffff; margin-bottom: 3px; }
    header p { font-size: 11px; color: var(--gold-accent); font-weight: 500; }

    /* شريط التنقل العلوي المثبت */
    .nav-bar-top {
      position: sticky;
      top: 0;
      background: rgba(10, 58, 42, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      padding: 10px 4px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      overflow-x: auto;
    }
    .nav-btn {
      background: none;
      border: none;
      font-size: 10px;
      font-weight: 600;
      color: #a3c2b5;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      white-space: nowrap;
      padding: 0 6px;
    }
    .nav-btn span { font-size: 16px; }
    .nav-btn.active-btn { color: var(--gold-accent); font-weight: 800; }

    .container { padding: 22px 16px 16px 16px; max-width: 480px; margin: 0 auto; }
    .page { display: none; animation: fadeIn 0.3s ease-in-out; }
    .page.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* أوقات الصلاة */
    .prayers-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .prayers-row { display: flex; gap: 10px; justify-content: center; }
    .prayer-card {
      background: var(--card-bg);
      flex: 1;
      border-radius: 18px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      border-top: 4px solid var(--madinah-green);
    }
    .prayer-card .name { font-weight: 700; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
    .prayer-card .time { font-size: 14px; color: var(--madinah-green); font-weight: 800; }

    .prayer-card.next-prayer {
      background: linear-gradient(135deg, #ffffff 0%, #fdfbf7 100%);
      border-top: 4px solid var(--gold-accent);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
    }
    .prayer-card.next-prayer .name { color: var(--madinah-green); font-weight: 800; }
    .prayer-card.next-prayer .time { color: #b8860b; font-weight: 800; }
    .countdown-badge {
      font-size: 9px;
      background: var(--madinah-green);
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 6px;
      margin-bottom: 4px;
      display: inline-block;
      font-weight: 700;
    }

    /* تصميم الساعة الرقمية الجديد (بدون خلفية + باللون الأبيض بستايل ديجيتال) */
    .digital-clock-container {
      background: transparent;
      padding: 18px 0 8px 0;
      text-align: center;
    }
    .clock-time {
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2px;
      font-family: 'Courier New', Courier, monospace, 'Tajawal', sans-serif;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      font-variant-numeric: tabular-nums;
    }
    .clock-date {
      font-size: 13px;
      color: var(--gold-accent);
      margin-top: 4px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .section-title { font-size: 15px; font-weight: 700; color: var(--gold-accent); margin: 18px 0 10px 0; }
    
    .content-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .card-title { font-weight: 700; color: var(--madinah-green); font-size: 14px; margin-bottom: 8px; border-bottom: 1px solid #eef2ee; padding-bottom: 6px; }
    .card-text { font-size: 13px; line-height: 1.8; color: var(--text-dark); }
    .card-count { font-size: 11px; background: #e8f5e9; color: var(--madinah-green); padding: 3px 9px; border-radius: 6px; display: inline-block; margin-top: 8px; font-weight: 700; }

    /* حقل البحث */
    .search-box {
      width: 100%;
      padding: 12px 15px;
      border-radius: 14px;
      border: 1px solid #c8e6c9;
      font-family: 'Tajawal', sans-serif;
      font-size: 13px;
      outline: none;
      background: #ffffff;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* السبحة الإلكترونية */
    .sebha-box {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      margin-top: 8px;
    }
    .sebha-selector {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      border: 1px solid #c8e6c9;
      font-family: 'Tajawal', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--madinah-green);
      background: #f4fbf7;
      margin-bottom: 18px;
      outline: none;
    }
    .sebha-counter-display { font-size: 58px; font-weight: 800; color: var(--madinah-green); margin: 8px 0; }
    .sebha-btn-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--madinah-green) 0%, var(--madinah-dark) 100%);
      color: var(--gold-accent);
      border: 3px solid var(--gold-accent);
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      outline: none;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }
    .sebha-btn-circle:active { transform: scale(0.95); }
    .btn-reset { background: #f0f4f1; border: none; padding: 8px 18px; border-radius: 10px; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

  <header>
    <h1>🕌 مسلم - صلاتي وأذكاري</h1>
    <p>رفيقك اليومي باللون النبوي الشريف</p>
  </header>

  <!-- شريط التنقل العلوي -->
  <div class="nav-bar-top">
